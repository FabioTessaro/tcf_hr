<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#ffffff" />
		<title>TCF HR</title>
		<!-- Typefaces: Noto Sans plus the Chinese and Japanese variants, as on the website (see tcf_web typography) -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Noto+Sans:wdth,wght@62.5..100,100..900&family=Noto+Sans+SC:wght@100..900&family=Noto+Sans+JP:wght@100..900&display=swap"
		/>
		<!-- Icon font, the same as the website (Material Symbols Sharp) -->
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Material+Symbols+Sharp:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
		/>
		<!-- Brand tokens shared with the website (tcf_web). Resolved at runtime, not bundled. -->
		<link rel="stylesheet" href="/assets/tcf_web/components/tokens/tokens.css" />
		<!-- Filled in by Frappe (www/hrms.py). Plain text under `yarn dev`, where main.js falls back. -->
		<meta name="csrf-token" content="{{ csrf_token }}" />
		<script id="boot" type="application/json">{{ boot | tojson }}</script>
	</head>
	<body class="tf-app-body">
		<div id="app"></div>
		<script type="module" src="/src/main.js"></script>
	</body>
</html>
